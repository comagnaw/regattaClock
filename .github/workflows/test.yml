name: Go Coverage with Cobertura

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# Cancel superseded runs on a PR branch; never cancel a post-merge full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - name: Install OpenGL development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libegl-dev

      # go test ./internal/... never compiles ./cmd; build and vet the whole
      # module so a stale main.go (a changed regatta.New / Bootstrap signature)
      # fails here instead of at release time.
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Generate Go test coverage
        run: go test ./internal/... -coverprofile=coverage.out -covermode=atomic

      - name: Convert to Cobertura XML
        run: |
          go install github.com/boumenot/gocover-cobertura@latest
          gocover-cobertura < coverage.out > coverage.xml

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
            filename: coverage.xml
            badge: true
            fail_below_min: true
            format: markdown
            hide_branch_rate: false
            hide_complexity: false
            indicators: true
            output: file
            thresholds: '60 80'
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

  # Fast Windows gate on every PR. The only genuinely OS-divergent code
  # (internal/filesystem rename-retry + its //go:build windows test,
  # internal/watcher / fsnotify ReadDirectoryChangesW) is pure Go, so this runs
  # CGO_ENABLED=0 with no MinGW. clock / regatta / text need CGO+GLFW and run
  # through Fyne's platform-agnostic test driver, so they are covered by
  # test-windows-full (post-merge) rather than blocking every PR.
  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      # Add a new pure-Go internal package here when one gains tests. Cue: does
      # it import fyne.io/fyne/v2? If not, it belongs on this list.
      - name: Test OS-portable packages
        env:
          CGO_ENABLED: '0'
        run: |
          go test `
            ./internal/applog/... `
            ./internal/exporter/... `
            ./internal/filesystem/... `
            ./internal/persona/... `
            ./internal/personacfg/... `
            ./internal/reader/... `
            ./internal/timesync/... `
            ./internal/watcher/...

  # Full native-Windows run: MinGW + the Fyne GUI packages. Detection insurance
  # against a Windows-only Fyne/CGO regression. Runs on merge to develop/main and
  # via workflow_dispatch - not on PRs.
  test-windows-full:
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      # Fyne links GLFW via CGO; Windows runners need a gcc toolchain.
      # Avoid egor-tensin/setup-mingw: its post-install cleanup breaks on current mingw packages.
      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$mingwBin;$env:PATH"
          gcc --version

      - name: Run tests
        run: go test ./internal/...
