name: Go Coverage with Cobertura

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'

      - name: Install OpenGL development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libxxf86vm-dev

      - name: Generate Go test coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Convert to Cobertura XML
        run: |
          go install github.com/boumenot/gocover-cobertura@latest
          gocover-cobertura < coverage.out > coverage.xml

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
            filename: coverage.xml
            badge: true
            fail_below_min: true
            format: markdown
            hide_branch_rate: false
            hide_complexity: false
            indicators: true
            output: file
            thresholds: '60 80'
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md