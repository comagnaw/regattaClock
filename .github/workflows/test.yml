name: Go Coverage with Cobertura

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'

      - name: Install OpenGL development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libxxf86vm-dev

      - name: Generate Go test coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Convert to Cobertura XML
        run: |
          go install github.com/boumenot/gocover-cobertura@latest
          gocover-cobertura < coverage.out > coverage.xml

      - name: Post Coverage Summary to PR
        uses: 5monkeys/cobertura-action@v1
        with:
          path: coverage.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 75