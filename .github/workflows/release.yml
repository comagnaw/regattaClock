name: Release

on:
  push:
    tags:
      - 'v*'

# The jobs publish the release with `gh release` (built-in GITHUB_TOKEN); that
# needs contents: write - the repo default is read.
permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.1'

    - name: Install Fyne
      run: |
        go install fyne.io/tools/cmd/fyne@latest

    - name: Build
      run: |
        mkdir -p build
        # Stamp the git tag (v-stripped), commit, and build metadata into the
        # binary via internal/version. The fyne CLI only picks ldflags up from
        # GOFLAGS, and `go` re-splits GOFLAGS on spaces, so every -X needs its
        # own -ldflags= token (values themselves are space-free).
        LDPKG=github.com/comagnaw/regattaClock/internal/version
        VER=${GITHUB_REF_NAME#v}
        BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        REPO_URL=${{ github.server_url }}/${{ github.repository }}
        # A tag build is on the tag and the CI tree is clean by construction, so
        # BuildCount is 0 (no +build suffix) and BuildDirty is false.
        export GOFLAGS="-ldflags=-X=${LDPKG}.Version=${VER} -ldflags=-X=${LDPKG}.BuildCommit=${{ github.sha }} -ldflags=-X=${LDPKG}.BuildDate=${BUILT} -ldflags=-X=${LDPKG}.BuildBranch=main -ldflags=-X=${LDPKG}.BuildUser=github-actions -ldflags=-X=${LDPKG}.Project=regattaClock -ldflags=-X=${LDPKG}.ExeName=regattaClock -ldflags=-X=${LDPKG}.RepoURL=${REPO_URL} -ldflags=-X=${LDPKG}.BuildCount=0 -ldflags=-X=${LDPKG}.BuildDirty=false"
        # Build for both architectures
        GOARCH=amd64 fyne package -os darwin -app-id com.github.comagnaw.regattaClock -release -src ./cmd/regattaClock/
        mv regattaClock.app build/regattaClock-intel.app
        GOARCH=arm64 fyne package -os darwin -app-id com.github.comagnaw.regattaClock -release -src ./cmd/regattaClock/
        mv regattaClock.app build/regattaClock-arm.app
        # Create app bundle structure
        mkdir -p build/regattaClock.app/Contents/MacOS
        # Create universal binary
        lipo -create -output build/regattaClock.app/Contents/MacOS/regattaClock build/regattaClock-intel.app/Contents/MacOS/regattaClock build/regattaClock-arm.app/Contents/MacOS/regattaClock
        # Copy other necessary files
        cp -r build/regattaClock-intel.app/Contents/Resources build/regattaClock.app/Contents/
        cp -r build/regattaClock-intel.app/Contents/Info.plist build/regattaClock.app/Contents/
        rm -rf build/regattaClock-arm.app
        rm -rf build/regattaClock-intel.app

    - name: Create DMG
      run: |
        cd build
        hdiutil create -volname "Regatta Clock" -srcfolder . -ov -format UDZO regattaClock.dmg

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # gh CLI instead of an Action: no Node-runtime deprecations and no
        # token-precedence surprises. Empty body now; the maintainer fills the
        # notes and sets --prerelease after the run (see AGENTS.md "Releases").
        # The tag already exists (it triggered this run). Idempotent on re-run.
        gh release create "${GITHUB_REF_NAME}" \
          --title "Release ${GITHUB_REF_NAME}" \
          --notes "" \
          build/regattaClock.dmg \
        || gh release upload "${GITHUB_REF_NAME}" build/regattaClock.dmg --clobber

  build-windows:
    runs-on: ubuntu-latest
    needs: build-macos
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.1'

    - name: Install Fyne
      run: |
        go install fyne.io/tools/cmd/fyne@latest
        go install github.com/fyne-io/fyne-cross@latest

    - name: Build Windows executable
      run: |
        # Pass the build stamp to the container as GOFLAGS, one -ldflags= token
        # per -X (the shape the macOS job uses). fyne does a two-phase Windows
        # build - compile, generate a metadata init file, rebuild - and the
        # rebuild re-serialises fyne-cross's -ldflags string into GOFLAGS. A
        # single space-containing -ldflags value there is unparseable
        # ("unterminated string"); one token per symbol survives the round-trip.
        # -env GOTOOLCHAIN=auto: the fyne-cross image pins an older Go with
        # GOTOOLCHAIN=local; go.mod needs 1.26, so let the container fetch it.
        LDPKG=github.com/comagnaw/regattaClock/internal/version
        VER=${GITHUB_REF_NAME#v}
        BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        REPO_URL=${{ github.server_url }}/${{ github.repository }}
        GOFLAGS="-ldflags=-X=${LDPKG}.Version=${VER} -ldflags=-X=${LDPKG}.BuildCommit=${{ github.sha }} -ldflags=-X=${LDPKG}.BuildDate=${BUILT} -ldflags=-X=${LDPKG}.BuildBranch=main -ldflags=-X=${LDPKG}.BuildUser=github-actions -ldflags=-X=${LDPKG}.Project=regattaClock -ldflags=-X=${LDPKG}.ExeName=regattaClock -ldflags=-X=${LDPKG}.RepoURL=${REPO_URL} -ldflags=-X=${LDPKG}.BuildCount=0 -ldflags=-X=${LDPKG}.BuildDirty=false"
        fyne-cross windows -arch amd64,386 -app-id com.github.comagnaw.regattaClock \
          -env GOTOOLCHAIN=auto \
          -env "GOFLAGS=${GOFLAGS}" \
          ./cmd/regattaClock
        mv fyne-cross/dist/windows-amd64/regattaClock.exe.zip fyne-cross/dist/windows-amd64/regattaClock-amd64.exe.zip
        mv fyne-cross/dist/windows-386/regattaClock.exe.zip fyne-cross/dist/windows-386/regattaClock-386.exe.zip
    - name: Upload Windows Release Asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${GITHUB_REF_NAME}" \
          fyne-cross/dist/windows-amd64/regattaClock-amd64.exe.zip \
          fyne-cross/dist/windows-386/regattaClock-386.exe.zip \
          --clobber
