name: Release

# Runs on a v* tag (full release) or on demand (workflow_dispatch - builds and
# uploads artifacts you can download from the run, but does not publish). See
# AGENTS.md "Releases" and docs/features/trusted-distribution/.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual build (default: git describe)"
        required: false

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Resolve the version once, and whether Windows signing material is present.
  # --------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      app_version: ${{ steps.v.outputs.app_version }}
      is_release: ${{ steps.v.outputs.is_release }}
      can_sign_windows: ${{ steps.s.outputs.can_sign_windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME}"
          else
            RAW="$(git describe --tags --always)"
          fi
          VERSION="${RAW#v}"
          # Numeric X.Y.Z for -app-version / the Win32 VERSIONINFO resource;
          # drops any -alpha / -N-gsha suffix. Falls back to 0.0.0.
          APP_VERSION="$(printf '%s' "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo '0.0.0')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=${{ github.ref_type == 'tag' }}" >> "$GITHUB_OUTPUT"
          echo "resolved version=$VERSION  app_version=$APP_VERSION  is_release=${{ github.ref_type == 'tag' }}"
      - id: s
        env:
          PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: echo "can_sign_windows=${{ env.PFX != '' }}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # macOS: unsigned universal DMG. Notarization is a mid-term item (see
  # docs/features/trusted-distribution/macos-notarization.md).
  # --------------------------------------------------------------------------
  build-macos:
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Install Fyne
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Build universal DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          LDPKG=github.com/comagnaw/regattaClock/internal/version
          VER='${{ needs.setup.outputs.version }}'
          APP_VER='${{ needs.setup.outputs.app_version }}'
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO_URL='${{ github.server_url }}/${{ github.repository }}'
          # One -ldflags= token per -X so `go` can re-split GOFLAGS on spaces
          # (values are space-free). A CI tag build is on the tag and clean, so
          # BuildCount=0 / BuildDirty=false.
          export GOFLAGS="-ldflags=-X=${LDPKG}.Version=${VER} -ldflags=-X=${LDPKG}.BuildCommit=${{ github.sha }} -ldflags=-X=${LDPKG}.BuildDate=${BUILT} -ldflags=-X=${LDPKG}.BuildBranch=${{ github.ref_name }} -ldflags=-X=${LDPKG}.BuildUser=github-actions -ldflags=-X=${LDPKG}.Project=regattaClock -ldflags=-X=${LDPKG}.ExeName=regattaClock -ldflags=-X=${LDPKG}.RepoURL=${REPO_URL} -ldflags=-X=${LDPKG}.BuildCount=0 -ldflags=-X=${LDPKG}.BuildDirty=false"
          GOARCH=amd64 fyne package -os darwin -app-id com.github.comagnaw.regattaClock -app-version "${APP_VER}" -release -src ./cmd/regattaClock/
          mv regattaClock.app regattaClock-intel.app
          GOARCH=arm64 fyne package -os darwin -app-id com.github.comagnaw.regattaClock -app-version "${APP_VER}" -release -src ./cmd/regattaClock/
          mv regattaClock.app regattaClock-arm.app
          mkdir -p regattaClock.app/Contents/MacOS
          lipo -create -output regattaClock.app/Contents/MacOS/regattaClock \
            regattaClock-intel.app/Contents/MacOS/regattaClock \
            regattaClock-arm.app/Contents/MacOS/regattaClock
          cp -r regattaClock-intel.app/Contents/Resources regattaClock.app/Contents/
          cp regattaClock-intel.app/Contents/Info.plist regattaClock.app/Contents/
          rm -rf regattaClock-intel.app regattaClock-arm.app
          hdiutil create -volname "Regatta Clock" -srcfolder regattaClock.app -ov -format UDZO \
            "dist/regattaClock-${VER}-macos-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows: native fyne package on windows-latest (MinGW), so the build stamp
  # (regattaClock -v) is populated exactly as on macOS. Produces a portable zip
  # and a per-user Inno Setup installer, both unsigned here.
  # --------------------------------------------------------------------------
  build-windows:
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build regattaClock.exe
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          gcc --version
          LDPKG=github.com/comagnaw/regattaClock/internal/version
          VER='${{ needs.setup.outputs.version }}'
          APP_VER='${{ needs.setup.outputs.app_version }}'
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO_URL='${{ github.server_url }}/${{ github.repository }}'

          # A plain `go build` - not `fyne package` - because fyne's Windows
          # packaging does a second build to embed the .syso and, in doing so,
          # consumes GOFLAGS and drops our -X stamp. Instead generate the
          # VERSIONINFO + icon .syso ourselves (go-winres) and let `go build`
          # auto-link it from the main package dir.
          go run github.com/tc-hib/go-winres@v0.3.3 simply \
            --arch amd64 --out rsrc \
            --product-name regattaClock \
            --product-version "${APP_VER}.0" \
            --file-version "${APP_VER}.0" \
            --file-description regattaClock \
            --original-filename regattaClock.exe \
            --manifest gui \
            --icon cmd/regattaClock/Icon.png
          mv rsrc_windows_amd64.syso cmd/regattaClock/

          # Match `fyne package -release`: -s -w, -H=windowsgui (no console
          # window), -trimpath, -tags release. One -X per internal/version symbol.
          LDFLAGS='-s -w -H=windowsgui'
          for kv in \
            "Version=${VER}" "BuildCommit=${{ github.sha }}" "BuildDate=${BUILT}" \
            "BuildBranch=${{ github.ref_name }}" "BuildUser=github-actions" \
            "Project=regattaClock" "ExeName=regattaClock" "RepoURL=${REPO_URL}" \
            "BuildCount=0" "BuildDirty=false" ; do
            LDFLAGS="${LDFLAGS} -X=${LDPKG}.${kv}"
          done
          go build -trimpath -tags release -ldflags "${LDFLAGS}" -o regattaClock.exe ./cmd/regattaClock
          rm -f cmd/regattaClock/rsrc_windows_amd64.syso
          file regattaClock.exe
          ls -la regattaClock.exe
      - name: Package portable zip + installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ needs.setup.outputs.version }}'
          $appVer = '${{ needs.setup.outputs.app_version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item packaging/windows/README.txt .
          Compress-Archive -Path regattaClock.exe, README.txt -DestinationPath "dist/regattaClock-$ver-windows-amd64-portable.zip" -Force
          # Inno Setup ships on windows-latest. Its [Files] Source: is resolved
          # relative to the .iss, so pass the exe as an absolute path.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $exe = (Resolve-Path regattaClock.exe).Path
          & $iscc /Q "/O$PWD\dist" "/DMyAppVersion=$ver" "/DMyAppVersionNumeric=$appVer" "/DMySrcExe=$exe" packaging/windows/regattaClock.iss
          Get-ChildItem dist
      - name: Upload bare exe (for the signing job)
        uses: actions/upload-artifact@v7
        with:
          name: win-exe-unsigned
          path: regattaClock.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-portable
          path: dist/*-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-setup
          path: dist/*-setup.exe
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows signing (Option B: self-signed cert + signtool, RFC 3161 timestamp).
  # Skips cleanly when WINDOWS_PFX_BASE64 is absent - the unsigned artifacts from
  # build-windows flow straight through to provenance/release. See
  # docs/features/trusted-distribution/windows-internal-pki.md.
  # --------------------------------------------------------------------------
  sign-windows:
    needs: [setup, build-windows]
    if: needs.setup.outputs.can_sign_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: win-exe-unsigned
      - name: Sign exe, rebuild + sign installer
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ needs.setup.outputs.version }}'
          $appVer = '${{ needs.setup.outputs.app_version }}'
          $tsa = 'http://timestamp.digicert.com'
          [IO.File]::WriteAllBytes("$PWD\signing.pfx", [Convert]::FromBase64String($env:PFX_B64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1).FullName
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          & $signtool sign /f signing.pfx /p $env:PFX_PASSWORD /fd SHA256 /tr $tsa /td SHA256 regattaClock.exe
          Copy-Item packaging/windows/README.txt .
          Compress-Archive -Path regattaClock.exe, README.txt -DestinationPath "dist/regattaClock-$ver-windows-amd64-portable.zip" -Force

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $exe = (Resolve-Path regattaClock.exe).Path
          & $iscc /Q "/O$PWD\dist" "/DMyAppVersion=$ver" "/DMyAppVersionNumeric=$appVer" "/DMySrcExe=$exe" packaging/windows/regattaClock.iss
          & $signtool sign /f signing.pfx /p $env:PFX_PASSWORD /fd SHA256 /tr $tsa /td SHA256 (Get-Item dist/*-setup.exe).FullName

          Remove-Item signing.pfx
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-portable
          path: dist/*-portable.zip
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-setup
          path: dist/*-setup.exe
          overwrite: true

  # --------------------------------------------------------------------------
  # Provenance: SHA256SUMS + a GitHub build-provenance attestation over every
  # released file. Free for public repos, no key to manage. See
  # docs/features/trusted-distribution/ci-and-provenance.md.
  # --------------------------------------------------------------------------
  provenance:
    needs: [setup, build-macos, build-windows, sign-windows]
    if: >-
      !cancelled()
      && needs.build-macos.result == 'success'
      && needs.build-windows.result == 'success'
      && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          overwrite: true

  # --------------------------------------------------------------------------
  # Publish. Tag builds only; a workflow_dispatch run stops after provenance
  # and leaves the artifacts on the run for download.
  # --------------------------------------------------------------------------
  release:
    needs: [setup, provenance]
    # sign-windows is skipped when unconfigured; that skip propagates through
    # the graph, so - like provenance - this job must guard explicitly rather
    # than rely on the implicit success() gate.
    if: >-
      !cancelled()
      && needs.setup.result == 'success'
      && needs.provenance.result == 'success'
      && needs.setup.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create / update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Empty body; the maintainer fills notes and sets --prerelease after
          # the run (AGENTS.md "Releases"). Idempotent on re-run.
          gh release create "${GITHUB_REF_NAME}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes "" \
            dist/* \
          || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
