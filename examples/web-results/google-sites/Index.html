<!DOCTYPE html>
<!--
  regattaClock Google Sites results PoC - the Apps Script page template.
  Same page as ../static/index.html; only the data layer differs:
  it asks Code.gs (google.script.run) for the index and results instead of
  fetching files. See README.md in this folder.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1b1f24; --muted: #5d6670;
    --line: #dde1e6; --accent: #0b5cad; --hi: #fff3bf; --scr: #8a929b;
    --head: #f2c94c; --head-ink: #1b1f24; --cancel: #b3261e;
    --bar: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --ink: #e8ebef; --muted: #9aa3ad;
      --line: #2c333b; --accent: #6cb0ff; --hi: #4a4118; --scr: #6b737c;
      --head: #c9a227; --head-ink: #111418; --cancel: #ff8a80;
      --bar: #141920;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 1; background: var(--card);
    border-bottom: 3px solid var(--head); padding: 14px 16px 0; text-align: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
  }
  h1 { margin: 0 0 4px; font-size: clamp(1.4rem, 1rem + 2vw, 2rem); line-height: 1.2; }
  .meta { color: var(--muted); font-size: .85rem; }
  #filters-toggle { display: none; }
  /* The filters sit in their own band, set off from the title above. */
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin: 12px -16px 0; padding: 10px 16px; background: var(--bar);
    border-top: 1px solid var(--line); text-align: left;
  }
  .controls label { display: flex; flex-direction: column; font-size: .75rem; color: var(--muted); }
  select, input, button {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  }
  input[type=search] { min-width: 200px; }
  button { cursor: pointer; align-self: flex-end; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 16px 40px; }
  .race {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    margin: 0 0 12px; overflow: hidden;
  }
  .race h2 {
    margin: 0; padding: 10px 12px; font-size: 1rem; display: flex;
    justify-content: space-between; gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    background: var(--head); color: var(--head-ink);
  }
  .race h2 small { font-weight: normal; color: var(--head-ink); opacity: .8; }
  .prog {
    display: inline-block; margin-left: 8px; padding: 1px 6px; border-radius: 4px;
    font-size: .75rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent);
    background: var(--card);
  }
  .note { padding: 6px 12px 0; color: var(--muted); font-size: .85rem; }
  .cancel { padding: 8px 12px; color: var(--cancel); font-weight: 600; }
  .status.cancel { padding: 24px; }
  tr.entry td { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  th { font-size: .75rem; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .place { display: inline-block; min-width: 2.2em; text-align: center; border-radius: 4px; font-weight: 600; }
  tr.scr td { color: var(--scr); font-style: italic; }
  tr.match td { background: var(--hi); }
  .info { color: var(--muted); font-size: .85rem; }
  .former { color: var(--muted); font-size: .85rem; }
  .status { padding: 24px; text-align: center; color: var(--muted); }
  .error { color: #c0392b; }
  @media (max-width: 560px) {
    /* On a phone the header is one slim pinned bar - the regatta's name and a
       Filters button showing what is filtered. The button opens the filters
       below it: season, regatta and Reload; then School; then Event. */
    header { padding: 8px 12px 0; }
    .titlebar { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
    h1 {
      flex: 1; min-width: 0; margin: 0; font-size: 1.1rem; text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #filters-toggle {
      display: block; flex: 0 1 auto; max-width: 55%; padding: 5px 10px; font-size: .85rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #filters-toggle.active { border-color: var(--accent); color: var(--accent); }
    header:not(.open) .meta, header:not(.open) .controls { display: none; }
    .meta { text-align: left; padding-bottom: 6px; }
    .controls { margin: 0 -12px; padding: 10px 12px; }
    .controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; }
    .controls label.grow { grid-column: 1 / -1; }
    #reload { grid-column: 3; grid-row: 1; }
    select, input[type=search] { min-width: 0; width: 100%; }
    .col-info, .col-split { display: none; }
    .former { display: block; }
    th, td { padding: 6px 8px; }
  }
</style>
</head>
<body>
<header id="header">
  <div class="titlebar">
    <h1 id="title">Regatta Results</h1>
    <button type="button" id="filters-toggle" aria-expanded="false" aria-controls="filters">Filters</button>
  </div>
  <div class="meta" id="meta">Loading...</div>
  <div class="controls" id="filters">
    <label>Season <select id="season"></select></label>
    <label>Regatta <select id="regatta"></select></label>
    <label class="grow">School <input type="search" id="school" placeholder="Filter by school"></label>
    <label class="grow">Event <input type="search" id="event" placeholder="Filter by event, e.g. M-1-8" list="events"></label>
    <datalist id="events"></datalist>
    <button type="button" id="reload" title="Fetch the latest published results">Reload</button>
  </div>
</header>
<main id="races"><div class="status">Loading results...</div></main>

<script>
/*
 * Kept line-for-line with ../static/index.html apart from the
 * server calls and URL handling, so the two PoCs stay comparable.
 */
(function () {
  "use strict";

  // Injected by doGet() in Code.gs: the query parameters, plus the regatta list
  // and the first regatta's results, so the first view needs no server calls.
  var INITIAL = <?!= initial ?>;
  // Middle dot as an escape, not a literal, so the source stays pure ASCII.
  var SEP = " \u00B7 ";
  var $ = function (id) { return document.getElementById(id); };
  var state = { index: null, results: null };

  // server calls a Code.gs function and resolves with its parsed JSON text.
  // The page cannot read Drive itself: the folder is private, and the script
  // runs as the account that owns it.
  function server(fn, arg) {
    return new Promise(function (resolve, reject) {
      var run = google.script.run
        .withSuccessHandler(function (text) {
          try { resolve(JSON.parse(text)); } catch (e) { reject(e); }
        })
        .withFailureHandler(function (err) { reject(err instanceof Error ? err : new Error(String(err))); });
      if (arg === undefined) { run[fn](); } else { run[fn](arg); }
    });
  }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") { n.textContent = attrs[k]; } else { n.setAttribute(k, attrs[k]); }
    });
    (children || []).forEach(function (c) { if (c) { n.appendChild(c); } });
    return n;
  }

  function option(value, label) { return el("option", { value: value, text: label }); }

  // --- URL state: ?season=2026&regatta=<regattaKey>&school=<text>&event=<text>
  function readQuery() {
    return { season: INITIAL.season, regatta: INITIAL.regatta, school: INITIAL.school || "",
             event: INITIAL.event || "" };
  }
  // Keeps the address bar pointing at the current selection when the page is
  // opened directly at /exec. Inside a Google Sites embed the outer page URL
  // never changes (see README).
  function writeQuery() {
    var params = {};
    if ($("season").value) { params.season = $("season").value; }
    if ($("regatta").value) { params.regatta = $("regatta").value; }
    if ($("school").value) { params.school = $("school").value; }
    if ($("event").value) { params.event = $("event").value; }
    try { google.script.history.replace(null, params); } catch (e) { /* not fatal */ }
  }

  // --- pickers ------------------------------------------------------------
  function seasons() {
    var seen = {};
    return state.index.regattas.map(function (r) { return r.season; })
      .filter(function (s) { return !seen[s] && (seen[s] = true); })
      .sort().reverse();
  }

  function fillSeasons(want) {
    var s = $("season"); s.innerHTML = "";
    seasons().forEach(function (v) { s.appendChild(option(v, v)); });
    if (want && seasons().indexOf(want) >= 0) { s.value = want; }
  }

  function fillRegattas(want) {
    var r = $("regatta"); r.innerHTML = "";
    state.index.regattas
      .filter(function (g) { return g.season === $("season").value; })
      .sort(function (a, b) { return b.date.localeCompare(a.date); })
      .forEach(function (g) {
        r.appendChild(option(g.regattaKey, g.date + " - " + g.name + (g.cancelled ? " (cancelled)" : "")));
      });
    if (want) { r.value = want; }
    if (!r.value && r.options.length) { r.selectedIndex = 0; }
  }

  function selectedEntry() {
    var key = $("regatta").value;
    return state.index.regattas.filter(function (g) { return g.regattaKey === key; })[0];
  }

  // --- rendering ----------------------------------------------------------
  // "Cancelled · Weather"; "other" shows its note.
  var REASONS = { weather: "Weather", water: "Water / course conditions" };
  function cancelText(c) {
    var why = c.reason === "other" ? (c.note || "Other")
      : (REASONS[c.reason] || c.reason) + (c.note ? " (" + c.note + ")" : "");
    return "Cancelled" + SEP + why;
  }

  // --- event filter ---------------------------------------------------------
  // A coach follows one event through the day: "M-1-8" shows its heats,
  // semi-finals and finals. A combined race matches through any of its parts:
  // "W-1x & M-1x" is found by "M-1x", and "M-2/Jr-4+" by "M-Jr-4" (one gender
  // and one boat, classes joined with "/").
  function eventKey(s) { return s.toLowerCase().replace(/\s+/g, "").replace(/\+/g, ""); }
  function eventNames(boatClass) {
    var names = [boatClass];
    boatClass.split(" & ").forEach(function (part) {
      names.push(part);
      var m = /^([MW])-(.+)-([^-]+)$/.exec(part.trim());
      if (m && m[2].indexOf("/") >= 0) {
        m[2].split("/").forEach(function (c) { names.push(m[1] + "-" + c + "-" + m[3]); });
      }
    });
    return names.map(eventKey);
  }
  // A typed size is the coxed boat: "M-1-4" finds the fours, not the quads
  // ("M-1-4x"); "M-1" still finds every M-1 event.
  function eventMatches(race, needle) {
    var sized = /\d$/.test(needle);
    return eventNames(race.boatClass || "").some(function (n) {
      for (var i = n.indexOf(needle); i >= 0; i = n.indexOf(needle, i + 1)) {
        if (!sized || n.charAt(i + needle.length) !== "x") { return true; }
      }
      return false;
    });
  }
  // The regatta's events, offered as the Event box is typed in.
  function fillEvents(data) {
    var list = $("events"), seen = {};
    list.innerHTML = "";
    data.races.map(function (r) { return r.boatClass || ""; })
      .filter(function (b) { return b && !seen[b] && (seen[b] = true); })
      .sort()
      .forEach(function (b) { list.appendChild(el("option", { value: b })); });
  }

  // "ACHS (formerly T.C. Williams)": an archive result keeps continuity with
  // the name the school rowed under at the time (formerName, optional).
  function schoolCell(r) {
    return el("td", {}, [
      document.createTextNode(r.school),
      r.formerName ? el("span", { "class": "former", text: " (formerly " + r.formerName + ")" }) : null
    ]);
  }

  function rowsFor(race) {
    // Finish order first, then every entered lane without a result: a scratch,
    // or a boat in a race that was cancelled or has no results yet.
    var rows = race.results.map(function (x) { return { r: x, kind: "" }; });
    var placed = {};
    race.results.forEach(function (x) { placed[x.lane] = true; });
    Object.keys(race.lanes || {}).sort(function (a, b) { return a - b; }).forEach(function (ln) {
      var e = race.lanes[ln];
      if (placed[ln]) { return; }
      var scr = e.status === "SCR";
      rows.push({ kind: scr ? "scr" : "entry", r: { place: scr ? "SCR" : "", lane: ln, school: e.school,
                                                     formerName: e.formerName, additionalInfo: e.additionalInfo,
                                                     split: "", time: "" } });
    });
    return rows;
  }

  // The phone's Filters button names what is filtered: "Filters: W-1-4 · Robinson".
  function updateFiltersToggle() {
    var on = [$("event").value.trim(), $("school").value.trim()].filter(Boolean);
    var b = $("filters-toggle");
    b.textContent = on.length ? "Filters: " + on.join(SEP) : "Filters";
    b.classList.toggle("active", on.length > 0);
  }

  function render() {
    updateFiltersToggle();
    var main = $("races"), data = state.results;
    main.innerHTML = "";
    if (!data) {
      if (state.index && !state.index.regattas.length) {
        $("meta").textContent = "";
        main.appendChild(el("div", { "class": "status", text: "No regatta results have been published yet." }));
      }
      return;
    }

    $("title").textContent = data.regatta.name + " Results";
    $("meta").textContent = data.regatta.date + SEP + data.races.length +
      " race" + (data.races.length === 1 ? "" : "s") + " published" + SEP + "updated " +
      new Date(data.publishedAt).toLocaleString();
    document.title = data.regatta.name + " Results";

    if (data.regatta.cancelled) {
      $("meta").textContent = data.regatta.date + SEP + cancelText(data.regatta.cancelled);
      main.appendChild(el("div", { "class": "status cancel", text: "This regatta was " +
        cancelText(data.regatta.cancelled).replace("Cancelled", "cancelled") + "." }));
      return;
    }

    fillEvents(data);
    var needle = $("school").value.trim().toLowerCase();
    var eventNeedle = eventKey($("event").value.trim());
    var shown = 0;
    // Archive races can share a number ("Race 27A" and "Race 27B" are both 27);
    // the sort keeps file order for ties and each section gets its own anchor.
    var anchors = {};
    var anchorFor = function (n) {
      anchors[n] = (anchors[n] || 0) + 1;
      return "race-" + n + (anchors[n] > 1 ? "-" + anchors[n] : "");
    };

    data.races.slice().sort(function (a, b) { return a.raceNumber - b.raceNumber; })
      .forEach(function (race) {
        if (eventNeedle && !eventMatches(race, eventNeedle)) { return; }
        var rows = rowsFor(race);
        // A renamed school also matches its name at the time ("Williams" finds
        // ACHS rows from before the rename).
        var hit = function (x) {
          return needle && [x.r.school, x.r.formerName || ""].some(function (n) {
            return n.toLowerCase().indexOf(needle) >= 0;
          });
        };
        if (needle && !rows.some(hit)) { return; }
        shown++;

        var body = el("tbody", {}, rows.map(function (x) {
          var cls = x.kind + (hit(x) ? " match" : "");
          return el("tr", { "class": cls.trim() }, [
            el("td", {}, [el("span", { "class": "place", text: x.r.place })]),
            el("td", { "class": "num", text: x.r.lane }),
            schoolCell(x.r),
            el("td", { "class": "info col-info", text: x.r.additionalInfo || "" }),
            el("td", { "class": "num col-split", text: x.r.split }),
            el("td", { "class": "num", text: x.r.time })
          ]);
        }));

        main.appendChild(el("section", { "class": "race", id: anchorFor(race.raceNumber) }, [
          el("h2", {}, [
            el("span", {}, [
              el("span", { text: race.title }),
              race.progression ? el("span", { "class": "prog", text: race.progression }) : null
            ]),
            el("small", { text: race.scheduledTime + (race.winningTime ? SEP + "winner " + race.winningTime : "") })
          ]),
          race.cancelled ? el("div", { "class": "cancel", text: cancelText(race.cancelled) }) : null,
          race.note ? el("div", { "class": "note", text: race.note }) : null,
          rows.length === 0 ? null : el("table", {}, [
            el("thead", {}, [el("tr", {}, ["Place", "Lane", "School", "Info", "Split", "Time"].map(function (h) {
              var c = h === "Info" ? "col-info" : h === "Split" ? "col-split" : "";
              return el("th", c ? { "class": c, text: h } : { text: h });
            }))]),
            body
          ])
        ]));
      });

    if (!shown) {
      var ev = $("event").value.trim(), sc = $("school").value.trim();
      main.appendChild(el("div", { "class": "status",
        text: ev && sc ? "No races for \"" + ev + "\" with \"" + sc + "\"."
          : ev ? "No races for \"" + ev + "\"."
          : sc ? "No results for \"" + sc + "\"." : "No races published yet." }));
    }
  }

  function showError(err) {
    $("meta").textContent = "";
    $("races").innerHTML = "";
    $("races").appendChild(el("div", { "class": "status error", text: "Could not load results: " + (err.message || err) }));
  }

  // --- loading ------------------------------------------------------------
  // Data that came with the page, each used once (Reload always asks again).
  function prefetched(key, file) {
    var v = INITIAL[key];
    if (!v || (file !== undefined && v.file !== file)) { return null; }
    INITIAL[key] = null;
    return Promise.resolve(file !== undefined ? v.data : v);
  }

  function loadRegatta() {
    var entry = selectedEntry();
    if (!entry) { state.results = null; render(); return Promise.resolve(); }
    $("meta").textContent = "Loading " + entry.name + "...";
    return (prefetched("results", entry.file) || server("getResults", entry.file)).then(function (data) {
      if (data.schemaVersion !== 1) { throw new Error("unsupported schemaVersion " + data.schemaVersion); }
      if (data.regatta.regattaKey !== entry.regattaKey) {
        throw new Error(entry.name + " file belongs to a different regatta (" + data.regatta.name + ")");
      }
      state.results = data;
      render();
    });
  }

  function loadAll() {
    var q = readQuery();
    var keep = { season: $("season").value || q.season, regatta: $("regatta").value || q.regatta };
    return (prefetched("index") || server("getIndex")).then(function (idx) {
      if (idx.schemaVersion !== 1) { throw new Error("unsupported index schemaVersion " + idx.schemaVersion); }
      state.index = idx;
      fillSeasons(keep.season);
      fillRegattas(keep.regatta);
      writeQuery();
      return loadRegatta();
    }).catch(showError);
  }

  $("season").addEventListener("change", function () { fillRegattas(); writeQuery(); loadRegatta().catch(showError); });
  $("regatta").addEventListener("change", function () { writeQuery(); loadRegatta().catch(showError); });
  $("school").addEventListener("input", function () { writeQuery(); render(); });
  $("event").addEventListener("input", function () { writeQuery(); render(); });
  // Phone: the Filters button opens and closes the filter panel.
  $("filters-toggle").addEventListener("click", function () {
    var open = $("header").classList.toggle("open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  $("reload").addEventListener("click", function () {
    INITIAL.index = INITIAL.results = null; // Reload always asks the server
    loadAll();
  });

  $("school").value = readQuery().school;
  $("event").value = readQuery().event;
  loadAll();
})();
</script>
</body>
</html>
